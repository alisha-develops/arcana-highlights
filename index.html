<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arcana highlights</title>
</head>
<body>
    <div class="bookspread">
        <div class="basepage left">page 1 left</div>
        <div class="basepage right">page 3 right</div>

        <div class="leaf">
            <div class="face front">page 1 right</div>
            <div class="face back">page 2 left</div>
        </div>
    
        <div class="leaf">
            <div class="face front">page 2 right</div>
            <div class="face back">page 3 left</div>
        </div>
    </div>
    
    <div class="booknav">
        <button id="prevspread">←</button>
        <button id="nextspread">→</button>
    </div>
</body>
</html>
